name: Acacia
description: Acacia (Acacia Communications) is a coherent optical networking company, an early Matrix Partners portfolio
  company that was acquired by Cisco. Acacia designs and manufactures high-speed coherent optical interconnect solutions
  built on silicon photonics, low-power DSP, and 3D siliconization, including performance-optimized modules (AC1200,
  CIM 8), MSA pluggable modules (CFP, CFP2, OSFP, QSFP-DD, QSFP28), and client optics components (PAM4 DSP, optical
  engines). These power AI scale-out and scale-across fabrics, data center interconnect, metro and long-haul networks,
  submarine cables, access and cable networks, and space communications. Acacia is a hardware/components provider
  and does not publish a public developer API or programmatic platform.
